name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Tell Vite where your Render backend lives (use your actual Render hostname)
          VITE_SERVER_HOST: "my-openfront-offline-vs-bots.onrender.com"
        run: |
          npm run build-prod
          DOMAIN="onrender.com" \
          GAME_ENV="prod" \
          GIT_COMMIT="${GITHUB_SHA}" \
          TURNSTILE_SITE_KEY="1x00000000000000000000AA" \
          CDN_BASE="/My-openfront-offline-vs-bots/" \
          npx tsx scripts/renderPagesHtml.ts

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
